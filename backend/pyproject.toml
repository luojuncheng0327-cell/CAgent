[project]
name = "cagent-backend"
version = "0.1.0"
description = "Local FastAPI gateway and LangGraph agent service for CAgent"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.143.0",
  "pydantic==2.14.1",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "langgraph==1.2.15",
  "langchain==1.4.5",
  "langchain-openai==1.7.1",
  "langgraph-checkpoint-sqlite==3.1.2",
  "aiosqlite==0.22.1",
  "SQLAlchemy==2.1.4",
  "alembic==1.20.0",
  "qdrant-client==1.19.1",
  "neo4j==6.4.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.6"]
worker = ["celery[redis]==5.6.3", "redis==8.1.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cagent_backend"]

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "cagent_backend/_migrations"
"alembic.ini" = "cagent_backend/_alembic.ini"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
